[package]
name = "dmnote-editor-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Shared DmNote editor, history, preset and migration engine"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/DmNote-App/DmNote"
include = ["src/**", "tests/**", "default_*.json", "README.md", "LICENSE"]

[features]
test-support = []

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["v4", "js"] }
base64 = "0.22"
log = "0.4"
sha2 = "0.10"
url = "2"
percent-encoding = "2"
once_cell = "1"
unicode-normalization = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
